<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Siswa - SD Islam Sultan Agung 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --text-main: #111827;
            --text-muted: #6b7280;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
            text-align: center;
        }

        .logo {
            max-width: 250px;
            width: 100%;
            height: auto;
            margin-bottom: 2.5rem;
        }

        .hero-text {
            max-width: 650px;
        }

        .hero-text h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
        }

        .hero-text p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 0.875rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        .btn-submit:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .result-container {
            display: none;
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }

        .result-container.active {
            display: block;
        }

        .result-container h3 {
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .result-container p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .pdf-wrapper {
            width: 100%;
            height: 600px;
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .iframe-pdf {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .student-info {
            display: none;
            background-color: #d1fae5;
            color: #065f46;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-align: left;
            border: 1px solid #34d399;
        }

        .error-message {
            color: #dc2626;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .error-message svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            color: #ef4444;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="logo.png" alt="Logo SD Islam Sultan Agung 4 Semarang" class="logo">
        <div class="hero-text">
            <h1>Portal Hasil Belajar Siswa</h1>
            <p>Silakan masukkan NIS/NISN dan pilih kelas Anda untuk melihat rapor atau nilai yang telah diunggah.</p>
        </div>
    </header>

    <main class="card">
        <form id="formCekNilai">
            <div class="form-group">
                <label for="nis">NIS / NISN</label>
                <input type="text" id="nis" class="form-control" placeholder="Masukkan NIS atau NISN siswa" required
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="kelas">Kelas</label>
                <select id="kelas" class="form-control" required>
                    <option value="" disabled selected>-- Pilih Kelas --</option>
                    <option value="1A">Kelas 1A</option>
                    <option value="1B">Kelas 1B</option>
                    <option value="2A">Kelas 2A</option>
                    <option value="2B">Kelas 2B</option>
                    <option value="3A">Kelas 3A</option>
                    <option value="3B">Kelas 3B</option>
                    <option value="4A">Kelas 4A</option>
                    <option value="4B">Kelas 4B</option>
                    <option value="5A">Kelas 5A</option>
                    <option value="5B">Kelas 5B</option>
                    <option value="6A">Kelas 6A</option>
                    <option value="6B">Kelas 6B</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Cek Nilai</button>
        </form>
    </main>

    <section class="result-container" id="resultContainer">
        <h3 id="resultTitle">Hasil Nilai Siswa</h3>
        <p id="resultSubtitle">Menampilkan dokumen untuk kelas Anda</p>

        <div id="studentInfo" class="student-info">
            <div id="studentName">Nama: -</div>
            <div id="studentNis">NIS: -</div>
        </div>

        <div class="pdf-wrapper">
            <!-- Iframe ini akan menampilkan PDF GDrive secara dinamis -->
            <iframe id="pdfFrame" class="iframe-pdf" allow="autoplay"></iframe>

            <!-- Pesan jika data tidak ditemukan -->
            <div id="errorMessage" class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <h4>Data Tidak Ditemukan</h4>
                <p style="margin-top: 0.5rem; font-size: 0.9rem; color: #4b5563;">Pastikan NIS/NISN dan Kelas yang
                    dimasukkan sudah benar.</p>
            </div>
        </div>
    </section>

        // Fungsi untuk mengubah link GDrive biasa menjadi link Embed (Preview)
        function getEmbedUrl(url) {
            if (!url) return null;

            // Cek apakah itu link GDrive
            if (url.includes('drive.google.com/file/d/')) {
                const regex = /[-\w]{25,}/;
                const match = url.match(regex);
                if (match && match[0]) {
                    return `https://drive.google.com/file/d/${match[0]}/preview`;
                }
            }
            // Cek apakah itu link folder Gdrive yg dishare secara embed
            else if (url.includes('drive.google.com/embeddedfolderview')) {
                return url;
            }

            return url; // Jika link tipe lain (misal langsung ke PDF), kembalikan aslinya
        }

        document.getElementById('formCekNilai').addEventListener('submit', function (e) {
            e.preventDefault();

            const nisInput = document.getElementById('nis').value.trim();
            const kelas = document.getElementById('kelas').value;
            const btnSubmit = document.getElementById('btnSubmit');
            const resultContainer = document.getElementById('resultContainer');
            const pdfFrame = document.getElementById('pdfFrame');
            const errorMessage = document.getElementById('errorMessage');

            const studentInfo = document.getElementById('studentInfo');
            const studentNameEl = document.getElementById('studentName');
            const studentNisEl = document.getElementById('studentNis');

            if (!nisInput || !kelas) {
                alert('Harap isi NIS/NISN dan pilih kelas!');
                return;
            }

            // UI Loading state
            btnSubmit.textContent = 'Mencari Data...';
            btnSubmit.disabled = true;
            resultContainer.classList.remove('active');
            pdfFrame.style.display = 'none';
            errorMessage.style.display = 'none';
            studentInfo.style.display = 'none';

            // Simulasi jeda pencarian (500ms) agar terasa natural
            setTimeout(() => {
                document.getElementById('resultSubtitle').textContent = `Menampilkan data Kelas: ${kelas}`;
                resultContainer.classList.add('active');

                // Validasi data berdasarkan input NIS dan dropdown kelas
                let isStudentFound = false;
                let foundName = "";
                let foundNis = "";

                if (databaseNilai[kelas] && databaseNilai[kelas].siswa) {
                    // Cek apakan inputan user cocok dengan NIS atau potongan dari NISN/NIS
                    const foundKey = Object.keys(databaseNilai[kelas].siswa).find(k =>
                        k === nisInput || k.split('/').includes(nisInput)
                    );

                    if (foundKey) {
                        isStudentFound = true;
                        foundName = databaseNilai[kelas].siswa[foundKey];
                        foundNis = foundKey;
                    }
                }

                // Jika siswa terdaftar di kelas yang dia pilih
                if (isStudentFound) {
                    const classDriveUrl = databaseNilai[kelas].linkGDrive;

                    if (classDriveUrl && classDriveUrl.trim() !== "") {
                        const embedUrl = getEmbedUrl(classDriveUrl);

                        // Menampilkan box notifikasi hijau berisi nama siswa yang login
                        studentNameEl.textContent = `Nama : ${foundName}`;
                        studentNisEl.textContent = `NIS/NISN : ${foundNis}`;
                        studentInfo.style.display = 'block';

                        if (embedUrl) {
                            pdfFrame.src = embedUrl;
                            pdfFrame.style.display = 'block'; // Tampilkan Iframe
                        } else {
                            errorMessage.style.display = 'flex'; // URL kelas bermasalah
                        }
                    } else {
                        // Link Gdrive kelas masih kosong
                        errorMessage.style.display = 'flex';
                    }
                } else {
                    // NIS tidak ditemukan di kelas tersebut
                    errorMessage.style.display = 'flex';
                }

                // Kembalikan tombol ke semula
                btnSubmit.textContent = 'Cek Nilai';
                btnSubmit.disabled = false;
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

            }, 500);
        });
    </script>
